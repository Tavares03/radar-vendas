[project]
name = "radar-evals"
version = "0.1.0"
description = "Avaliação do sistema inteiro do Radar de Vendas (alertas, mascaramento, resumo, custo)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "radar-vendas",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.scripts]
radar-evals = "radar_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_evals"]

[tool.uv.sources]
radar-vendas = { workspace = true }
