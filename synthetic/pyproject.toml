[project]
name = "radar-synthetic"
version = "0.1.0"
description = "Gerador de conversas de venda sintéticas e anotadas em PT-BR (formato de export do WhatsApp)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "radar-vendas",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.scripts]
radar-synth = "radar_synth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_synth"]

[tool.uv.sources]
radar-vendas = { workspace = true }
