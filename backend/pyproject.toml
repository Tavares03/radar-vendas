[project]
name = "radar-vendas"
version = "0.1.0"
description = "Radar de Vendas: supervisor de vendas com IA para equipes que vendem pelo WhatsApp (API, worker e biblioteca de análise)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Gabriel Tavares" }]
keywords = ["whatsapp", "vendas", "lgpd", "compliance", "nlp", "pt-br"]
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Banco
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # Fila
    "redis>=5.2",
    "rq>=2.0",
    # Segurança
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    # Utilidades
    "httpx>=0.28",
    "structlog>=24.4",
    "pyyaml>=6.0.2",
    "typer>=0.15",
    "prometheus-client>=0.21",
    "rapidfuzz>=3.10",
    "reportlab>=4.2",
    # Inferência local (sem PyTorch)
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.27",
    "faster-whisper>=1.1",
    "av>=13.0",
    "tzdata>=2024.2",
]

[project.scripts]
radar = "radar.cli:app"

[project.urls]
Repository = "https://github.com/Tavares03/radar-vendas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]
