[project]
name = "radar-training"
version = "0.1.0"
description = "Treino e avaliação dos modelos próprios do Radar de Vendas (NER de dados pessoais e classificador de mensagens)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "radar-vendas",
    "radar-synthetic",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.scripts]
radar-train = "radar_training.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_training"]

[tool.uv.sources]
radar-vendas = { workspace = true }
radar-synthetic = { workspace = true }
