[project]
name = "radar-training"
version = "0.1.0"
description = "Treino e avaliação dos modelos próprios do Radar de Vendas (NER de dados pessoais e classificador de mensagens)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "radar-vendas",
    "radar-synthetic",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.optional-dependencies]
# Pesado (PyTorch, Transformers). Na raiz: `uv sync --all-packages --group train`.
# O pacote importa tudo isso só dentro das funções de treino: dados, métricas e baselines rodam
# sem PyTorch (e é assim que a CI testa).
train = [
    "torch>=2.15",
    "transformers>=5.23",
    "safetensors>=0.8",
    "scikit-learn>=1.9",
    "onnx>=1.23",
    "onnxscript>=0.7",
    "huggingface-hub>=2.4",
]

[project.scripts]
radar-train = "radar_training.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_training"]

[tool.uv.sources]
radar-vendas = { workspace = true }
radar-synthetic = { workspace = true }
