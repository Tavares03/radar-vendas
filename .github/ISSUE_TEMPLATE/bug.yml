name: Problema (bug)
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Não cole conversas reais.** Troque nomes, telefones e documentos por dados falsos
        antes de enviar. Falhas de segurança não vão aqui: veja o SECURITY.md.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Passo a passo, com um exemplo mínimo e sintético.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
  - type: dropdown
    id: modo
    attributes:
      label: Como você está rodando?
      options:
        - Docker Compose
        - Local (uv + npm)
        - Space do Hugging Face
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Remova dados pessoais e chaves de API.
      render: text
