name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  RADAR_DISABLE_ENV_FILE: "1"

jobs:
  backend:
    name: Backend (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --all-packages --group dev --no-group train
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy backend/src synthetic/src evals/src training/src
      - name: Testes (SQLite)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

  backend-postgres:
    name: Backend (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RADAR_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/radar_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --all-packages --group dev --no-group train
      - name: Migrations aplicam do zero e não há drift
        working-directory: backend
        env:
          RADAR_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/radar_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Testes (PostgreSQL)
        run: uv run pytest

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos da API em dia com o openapi.json
        run: npm run api:types && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validar o Compose
        run: docker compose config --quiet
      - name: Construir as imagens
        run: docker compose build
